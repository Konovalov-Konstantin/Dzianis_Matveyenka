plugins {
    id 'java'
    id 'io.freefair.lombok' version '8.6'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    /*для аннотаций @PostConstruct и @Predestroy*/
    implementation group: 'jakarta.annotation', name: 'jakarta.annotation-api', version: '1.3.5'

    implementation group: 'org.springframework', name: 'spring-core', version: '6.0.11'
    implementation group: 'org.springframework', name: 'spring-context', version: '6.1.14'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

test {
    useJUnitPlatform()
}